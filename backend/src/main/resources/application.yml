spring:
  application:
    name: qms-backend
  datasource:
    # NFR-SEC-013: credentials come from the environment, never from source control.
    url: ${QMS_DB_URL:jdbc:postgresql://localhost:5432/qms}
    username: ${QMS_DB_USER:qms}
    password: ${QMS_DB_PASSWORD:}
  flyway:
    # FR-OPS-020: in production the `migrate` profile runs migrations as a separate step and the app starts with
    # QMS_MIGRATE_ON_START=false. Development and tests migrate on start.
    enabled: ${QMS_MIGRATE_ON_START:true}
    locations: classpath:db/migration

server:
  error:
    whitelabel:
      enabled: false

logging:
  structured:
    format:
      console: logstash # NFR-MNT-001: JSON logs; MDC (trace_id) is included as a top-level member
    json:
      customizer: com.qms.platform.LogRedactionCustomizer # API-018: tokens, OTPs and ticket secrets never reach the log

qms:
  queue:
    # FR-QUE-030: a fallback counter link may trail the best ticket by this many minutes of score and still lose to a primary one.
    primary-link-tolerance-minutes: ${QMS_QUEUE_PRIMARY_TOLERANCE_MINUTES:5}
    # FR-DSP-028: how many times an Agent may Re-announce (F3) a ticket.
    announce-repeat-limit: ${QMS_QUEUE_ANNOUNCE_REPEAT_LIMIT:3}
    # FR-QUE-050: a ticket may be missed (F6) this many times and return to the queue; the next Miss closes it as no_show.
    miss-limit: ${QMS_QUEUE_MISS_LIMIT:2}
    # FR-QUE-051: where a missed ticket re-enters the queue: front, after-n or back; after-n keeps this many tickets ahead of it.
    miss-reentry-position: ${QMS_QUEUE_MISS_REENTRY_POSITION:after-n}
    miss-reentry-after: ${QMS_QUEUE_MISS_REENTRY_AFTER:3}
    # FR-AGT-013: how many tickets one session may hold (F8) at once; 0 switches Hold off.
    hold-limit: ${QMS_QUEUE_HOLD_LIMIT:3}
    # FR-QUE-032: how long a called ticket waits for its Agent to act before the Agent is prompted (and may return it to the queue); 0 switches it off.
    call-timeout-seconds: ${QMS_QUEUE_CALL_TIMEOUT_SECONDS:90}
    # FR-QUE-053: the Head start, in minutes, of a Successor ticket made by a transfer (F7); empty means the predecessor's accrued wait.
    transfer-headstart-minutes: ${QMS_QUEUE_TRANSFER_HEADSTART_MINUTES:}
  visitor:
    # FR-INT-012: the hard timeout VisitorDirectoryGateway gives each visitor directory implementation before falling
    # through to the next one (ultimately the local one), so a slow or unreachable directory never blocks Reception.
    directory-timeout: ${QMS_VISITOR_DIRECTORY_TIMEOUT:1500ms}
    # FR-SEC-023: which OPTIONAL walk-in fields POST /visitors captures: email, category, purpose. name and phone are
    # always captured; they are the minimum record itself. A field left out is neither captured nor retained.
    registration-fields: ${QMS_VISITOR_REGISTRATION_FIELDS:email,category,purpose}
    import:
      # FR-INT-011: a folder VisitorImportScheduler polls for *.csv files to import unattended. Empty (the default)
      # switches scheduled pickup off entirely; a manual upload through the API works either way. How often the
      # folder is checked is qms.visitor.import.pickup-cron, a cron expression defaulting to "-" (disabled), the
      # same convention as qms.numbering.scheduler.cron and qms.queue.call-timeout-check-cron.
      pickup-dir: ${QMS_VISITOR_IMPORT_PICKUP_DIR:}
  # FR-AGT-034: which visitor fields the console shows a role, by role wire name, e.g.
  #   qms.console.visitor-fields.agent=code,category,purpose_note   (fields: code, name, category, purpose_note)
  # A role with no entry sees all of them; an entry with no fields shows none. Set it with properties or environment.
  i18n:
    system-default-language: en
    languages: en,bn
    site-default-language: ${QMS_SITE_DEFAULT_LANGUAGE:}
    pack-dir: ${QMS_I18N_PACK_DIR:}
  security:
    issuer: ${QMS_ISSUER:https://qms.local}
    key-dir: ${QMS_KEY_DIR:./keys}
    refresh-cookie:
      secure: ${QMS_REFRESH_COOKIE_SECURE:true}
    bootstrap:
      username: ${QMS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${QMS_BOOTSTRAP_ADMIN_PASSWORD:}
  notification:
    web-push:
      # NFR-SEC-013: the VAPID key pair is generated on first start and kept outside source control, same convention as key-dir above.
      key-dir: ${QMS_VAPID_KEY_DIR:./keys/vapid}
      subject: ${QMS_VAPID_SUBJECT:mailto:admin@qms.local}
    email:
      # FR-INT-040, §27.2: "clients supply an SMTP relay for email"; a blank host (the default) leaves the channel
      # unconfigured, so it fails clean (smtp_not_configured) instead of trying to connect anywhere.
      host: ${QMS_SMTP_HOST:}
      port: ${QMS_SMTP_PORT:587}
      username: ${QMS_SMTP_USERNAME:}
      password: ${QMS_SMTP_PASSWORD:}
      starttls: ${QMS_SMTP_STARTTLS:true}
      from: ${QMS_SMTP_FROM:noreply@qms.local}
  connectivity:
    # FR-QUE-202, FR-MOB-041, ADR-0001, ticket 44: external URLs InternetConnectivityMonitor probes to detect this
    # Site's own loss of internet (its public origin, a Web Push provider, or both); empty (the default) leaves
    # checking off and the Site assumed reachable (fail open). How often it probes (blank/"-" default: off; a test
    # drives the check directly instead) is qms.connectivity.check-cron.
    probe-targets: ${QMS_CONNECTIVITY_PROBE_TARGETS:}
    check-cron: ${QMS_CONNECTIVITY_CHECK_CRON:-}
    failure-threshold: ${QMS_CONNECTIVITY_FAILURE_THRESHOLD:3}
    timeout: ${QMS_CONNECTIVITY_TIMEOUT:3s}
