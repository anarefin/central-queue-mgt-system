# Report export (ticket 49, FR-RPT-003/006): the header block and column headers a CSV/XLSX/PDF export carries,
# rendered server-side (the file is generated off the request thread for a background export, so there is no
# frontend around to supply this text) — the column keys mirror F/packages/i18n's own reports.detailedToken.col.*
# wording so the exported file's headers read the same as the on-screen table's.
reports.export.header.report=Report
reports.export.header.filters=Filters
reports.export.header.generatedAt=Generated at
reports.export.header.generatedBy=Generated by
# Scheduled report delivery (ticket 52, FR-RPT-005): the email a schedule sends is rendered server-side with no
# frontend around it, the same "no frontend to supply this text" reasoning the export header block above already
# gives for its own strings.
reports.schedule.email.subject=Scheduled report: {0}
reports.schedule.email.body=Your scheduled "{0}" report for {1} to {2} is attached.
