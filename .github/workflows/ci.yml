name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Unit and slice tests, then Testcontainers integration tests against real PostgreSQL (Docker is on the runner).
      - run: ./gradlew check
      # NFR-SEC-051: fail the build on unpatched critical (CVSS >= 9) dependency vulnerabilities.
      - run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:css
      - run: pnpm build
      # NFR-SEC-051: fail on unpatched critical findings.
      - run: pnpm audit --audit-level=critical

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      QMS_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/v1/health/dependencies
      - run: curl -fsS http://localhost:8080/admin/ > /dev/null
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
