name: CI

on:
  push:
  pull_request:
  # Ticket 70: the Playwright UAT suite (frontend/e2e) needs a real deploy/compose.yaml stack with a vertical
  # profile applied, one run per profile — too slow/heavy to run on every push, so it is manually triggered only
  # (the `e2e` job below is itself further gated on this event, see its own `if:`).
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Unit and slice tests, then Testcontainers integration tests against real PostgreSQL (Docker is on the runner).
      - run: ./gradlew check
      # NFR-SEC-051: fail the build on unpatched critical (CVSS >= 9) dependency vulnerabilities.
      - run: ./gradlew dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint:css
      - run: pnpm build
      # NFR-SEC-051: fail on unpatched critical findings.
      - run: pnpm audit --audit-level=critical

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      QMS_DB_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build --wait
      - run: curl -fsS http://localhost:8080/api/v1/health/dependencies
      - run: curl -fsS http://localhost:8080/admin/ > /dev/null
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v

  # Ticket 70: the Playwright UAT suite against a real stack, once per shipped profile (SRS §27.2/§27.3). Manual
  # only (workflow_dispatch, see the top-level `on:`) — each run brings up its own compose stack, applies one
  # profile via the setup wizard's own API, then runs frontend/e2e (deliberately outside the pnpm workspace, see
  # its own package.json and MAP.md, so it is driven here with npm rather than the frontend job's pnpm steps).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        profile: [banking, healthcare, producer_services]
    env:
      QMS_DB_PASSWORD: ci-only-not-a-secret
      QMS_BOOTSTRAP_ADMIN_USERNAME: e2e-admin
      QMS_BOOTSTRAP_ADMIN_PASSWORD: E2E-Admin-Passw0rd-9
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml up -d --build --wait
      - name: Apply the ${{ matrix.profile }} vertical profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$QMS_BOOTSTRAP_ADMIN_USERNAME\",\"password\":\"$QMS_BOOTSTRAP_ADMIN_PASSWORD\"}" | jq -r .access_token)
          curl -fsS -X POST http://localhost:8080/api/v1/setup/profile \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"profile_id\":\"$PROFILE\"}" > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the Playwright suite
        working-directory: frontend/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the UAT suite against the ${{ matrix.profile }} profile
        working-directory: frontend/e2e
        env:
          QMS_PROFILE: ${{ matrix.profile }}
          BASE_URL: http://localhost:8080
        run: pnpm e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.profile }}
          path: frontend/e2e/report
          if-no-files-found: ignore
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v
