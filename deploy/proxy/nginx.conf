# One origin for every app and the API, so the SameSite=Strict refresh cookie works (API-017, ADR-0012).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The container listens on 80 but is published on any host port; a relative Location keeps the browser on the
    # port it used (an absolute redirect would name port 80).
    absolute_redirect off;

    # Never let a browser or proxy cache the runtime config or a language pack index.
    location ~ ^/(admin|console|kiosk|display|visitor)/config\.json$ {
        add_header Cache-Control "no-store";
    }

    location = / {
        return 302 /visitor/;
    }

    # The realtime hub (SRS §21.1): WebSocket, so the upgrade must pass through. The hub and clients heartbeat every 20 s,
    # so a connection is never silent for longer than the read timeout unless something is wrong with it.
    # X-Forwarded-Host keeps the published port ($http_host): the backend rebuilds its own URL from the X-Forwarded-*
    # headers and accepts an upgrade only from the page's own origin, which on any port but 80 carries that port.
    location = /api/v1/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 75s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_read_timeout 30s;
    }

    # Extra language packs added by the installation without a release (FR-I18N-001).
    location /i18n/ {
        alias /etc/qms/i18n/;
        add_header Cache-Control "no-store";
    }

    # Static-export routing: /admin/ -> /admin/index.html, /admin/login -> /admin/login/index.html
    location ~ ^/(admin|console|kiosk|display|visitor)(/.*)?$ {
        try_files $uri $uri/ $uri.html /$1/index.html;
    }

    location /_next/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
